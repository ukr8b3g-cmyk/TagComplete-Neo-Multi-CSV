name: Materialize README screenshots

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/readme-settings-assets-temp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out temporary asset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Decode screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/readme-assets
          cat .github/readme-assets/en.part* | base64 --decode > /tmp/readme-assets/settings-en.png
          cat .github/readme-assets/ja.part* | base64 --decode > /tmp/readme-assets/settings-ja.png
          echo "cab2148ba516759e47676a5f20f6ea66db42ca42003265cd208ce2896bddd031  /tmp/readme-assets/settings-en.png" | sha256sum --check --strict
          echo "cf47a50826e0ec2559bea57ee8f729958ec73a2991a1e01f0a2d678685df7f5a  /tmp/readme-assets/settings-ja.png" | sha256sum --check --strict
          test "$(wc -c < /tmp/readme-assets/settings-en.png)" -eq 15655
          test "$(wc -c < /tmp/readme-assets/settings-ja.png)" -eq 16211

      - name: Commit screenshots to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          mkdir -p docs/images
          cp /tmp/readme-assets/settings-en.png docs/images/settings-en.png
          cp /tmp/readme-assets/settings-ja.png docs/images/settings-ja.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/settings-en.png docs/images/settings-ja.png
          if git diff --cached --quiet; then
            echo "Screenshots already match; nothing to commit."
          else
            git commit -m "Add bilingual README settings screenshots"
            git push origin main
          fi
